name: Regression tests

# Builds the app and the regression tests (tests/, see tests/README.md) on
# both Linux architectures, and runs the tests.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/regression-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/regression-tests.yml'

permissions:
  contents: read

concurrency:
  group: regression-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install dependencies
        run: |
          # The runner image ships Microsoft apt repos (azure-cli, prod) that
          # intermittently serve broken signatures and fail `apt-get update`.
          # This build doesn't need them, so drop them first.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* /etc/apt/sources.list.d/azure-cli.*
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev qt6-declarative-dev qt6-svg-dev libdrm-dev libssl-dev libsdl2-dev libpcsclite-dev libmpv-dev
      - name: Configure application
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build application
        run: cmake --build build --parallel 2
      - name: Configure tests
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Debug
      - name: Build tests
        run: cmake --build build-tests --parallel 2
      - name: Run regression tests
        run: ctest --test-dir build-tests --output-on-failure --timeout 60
