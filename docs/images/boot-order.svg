<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="Boot order. In a manual install OSD/OS starts last, after multi-user.target, once every service has started. On the OSD/OS image it starts right after basic.target and its boot screen is up while Wi-Fi, Bluetooth, the local network, optional SSH and the online check start one after another, after its first frame.">
