<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="How the picture reaches the TV. On a desktop, OSD/OS and mpv hand their frames to the labwc compositor, which holds the screen. In a kiosk, Xorg or cage holds it. On the OSD/OS image there is no window manager or compositor: OSD/OS and mpv draw straight to the kernel's KMS/DRM driver, taking the screen in turn. With Transparent Background, mpv runs inside OSD/OS as libmpv and OSD/OS keeps the screen, drawing its menus over the video.">
